steps:
  # 0. Pull the latest image to use as a cache (ignore failure if it's the first run)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull asia-south1-docker.pkg.dev/$PROJECT_ID/portfolio-repo/intelligent-portfolio-backend:latest || exit 0']

  # 1. Build and tag as :latest only (avoids accumulating per-commit images in Artifact Registry)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/portfolio-repo/intelligent-portfolio-backend:latest'
      - '--cache-from'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/portfolio-repo/intelligent-portfolio-backend:latest'
      - './be'

  # 2. Push :latest
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/portfolio-repo/intelligent-portfolio-backend:latest'

  # 3. Deploy :latest — HARD COST CAP: scale-to-zero, CPU only during requests, max 1 instance
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'intelligent-portfolio-backend'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/portfolio-repo/intelligent-portfolio-backend:latest'
      - '--region'
      - 'asia-south1'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--cpu-boost'
      # Scale to ZERO when idle (required for ~₹200/mo personal traffic).
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      # CPU only while serving requests — NOT always-allocated (that alone can be ₹thousands/mo).
      - '--cpu-throttling'
      - '--concurrency'
      - '20'
      - '--timeout'
      - '300'
      # Startup probe only (no liveness/readiness probes — those can keep instances warm).
      - '--startup-probe'
      - 'httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=2,periodSeconds=5,failureThreshold=12'
      - '--set-secrets=/secrets/.env=PORTFOLIO_SECRETS:latest'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/portfolio-repo/intelligent-portfolio-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
